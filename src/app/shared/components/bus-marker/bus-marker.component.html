<div [class]="markerClass()">
    <div class="marker-body">
        <i class="pi pi-truck"></i>
        @if (label()) {
            <span class="marker-label">{{ label() }}</span>
        }
    </div>
    <div class="direction-arrow" [ngStyle]="arrowStyle()">
        <i class="pi pi-arrow-up"></i>
    </div>
    <div class="pulse-ring"></div>
</div>
