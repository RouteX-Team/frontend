<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">

<head>
  <meta charset="utf-8">
  <title>RouteX - Smart campus transport</title>
  <base href="/">
  <meta name="description" content="RouteX - real-time smart campus transport for Aldridge University.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f7a5b">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
</head>

<body>
  <app-root></app-root>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('routex-theme');
      const savedDensity = localStorage.getItem('routex-density') || 'comfortable';
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-density', savedDensity);
    })();
  </script>
</body>

</html>
