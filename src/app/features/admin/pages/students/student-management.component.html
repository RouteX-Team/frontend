<div class="admin-page-container">
    <header class="page-header">
        <div class="header-content">
            <h1>Student Management</h1>
            <p class="text-muted">Manage university students and their access</p>
        </div>
        <button pButton label="Add Student" icon="pi pi-plus" (click)="openNew()"></button>
    </header>

    <div class="card">
        <p-table [value]="students()" [rows]="10" [paginator]="true" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Favorites</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-student>
                <tr>
                    <td>
                        <div class="flex items-center gap-2">
                            <span class="avatar-mock-blue">{{ student.name.charAt(0) }}</span>
                            <span class="font-semibold">{{ student.name }}</span>
                        </div>
                    </td>
                    <td>{{ student.email }}</td>
                    <td>
                        <span class="fav-count">
                            <i class="pi pi-star-fill text-warning"></i>
                            {{ student.favoriteRouteIds?.length || 0 }}
                        </span>
                    </td>
                    <td>
                        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-info mr-2"
                            (click)="editStudent(student)"></button>
                        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger"
                            (click)="deleteStudent(student)"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
    <p-toast></p-toast>
</div>
