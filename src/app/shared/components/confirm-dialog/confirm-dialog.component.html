<p-dialog [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true"
    [style]="{ width: '400px' }" [closable]="true" (onHide)="onHide()"
    [header]="config().title" [styleClass]="'confirm-dialog ' + getSeverityClass()">

    <div class="dialog-content">
        <div class="icon-container" [class]="getSeverityClass()">
            @switch (config().severity) {
                @case ('danger') {
                    <i class="pi pi-exclamation-triangle"></i>
                }
                @case ('warning') {
                    <i class="pi pi-exclamation-circle"></i>
                }
                @default {
                    <i class="pi pi-info-circle"></i>
                }
            }
        </div>
        <p class="message">{{ config().message }}</p>
    </div>

    <ng-template pTemplate="footer">
        <button pButton [label]="config().cancelLabel || 'Cancel'"
            class="p-button-text p-button-secondary" (click)="onCancel()">
        </button>
        <button pButton [label]="config().confirmLabel || 'Confirm'"
            [icon]="config().confirmIcon || ''" [class]="getConfirmButtonClass()"
            (click)="onConfirm()">
        </button>
    </ng-template>
</p-dialog>
