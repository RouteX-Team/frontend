<div class="admin-page-container">
    <header class="page-header">
        <div class="header-content">
            <h1>Driver Management</h1>
            <p class="text-muted">Manage university bus drivers and route assignments</p>
        </div>
        <button pButton label="Add Driver" icon="pi pi-plus" (click)="openNew()"></button>
    </header>

    <div class="card">
        <p-table [value]="drivers()" [rows]="10" [paginator]="true" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Assigned Route</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-driver>
                <tr>
                    <td>
                        <div class="flex items-center gap-2">
                            <span class="avatar-mock">{{ driver.name.charAt(0) }}</span>
                            <span class="font-semibold">{{ driver.name }}</span>
                        </div>
                    </td>
                    <td>{{ driver.email }}</td>
                    <td>
                        <span [class]="'route-chip ' + (driver.assignedRouteId ? 'assigned' : 'unassigned')">
                            {{ getRouteName(driver.assignedRouteId) }}
                        </span>
                    </td>
                    <td>
                        <span [class]="'status-pill ' + (driver.isTracking ? 'online' : 'offline')">
                            {{ driver.isTracking ? 'Tracking' : 'Offline' }}
                        </span>
                    </td>
                    <td>
                        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-info mr-2"
                            (click)="editDriver(driver)"></button>
                        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger"
                            (click)="deleteDriver(driver)"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
    <p-toast></p-toast>
</div>
