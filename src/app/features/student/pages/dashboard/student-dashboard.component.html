@if (isLoading()) {
    <div class="loading-container">
        <rx-loading-spinner size="lg" label="Loading routes..." />
    </div>
} @else {
    <div class="dashboard">
        <!-- Routes Section -->
        <section class="routes-section">
            <div class="section-header">
                <h2 class="section-title">Bus Routes</h2>
                <div class="filters">
                    <button class="filter-btn" [class.active]="filter() === 'all'" (click)="filter.set('all')">
                        All
                    </button>
                    <button class="filter-btn" [class.active]="filter() === 'active'" (click)="filter.set('active')">
                        <span class="live-dot"></span>
                        Active
                    </button>
                    <button class="filter-btn" [class.active]="filter() === 'favorites'" (click)="filter.set('favorites')">
                        <i class="pi pi-star-fill"></i>
                        Favorites
                        @if (favoritesCount() > 0) {
                            <span class="filter-badge">{{ favoritesCount() }}</span>
                        }
                    </button>
                </div>
            </div>

            <div class="routes-grid">
                @for (route of filteredRoutes(); track route.id) {
                    <rx-route-card [route]="route" [bus]="getBusForRoute(route.id)" [isFavorite]="isFavorite(route.id)"
                        (cardClick)="onRouteClick($event)" (favoriteToggle)="onFavoriteToggle($event)" />
                } @empty {
                    <rx-empty-state
                        [icon]="filter() === 'favorites' ? 'pi-star' : 'pi-inbox'"
                        [title]="filter() === 'favorites' ? 'No favorite routes yet' : 'No routes available'"
                        [message]="filter() === 'favorites' ? 'Star a route to add it to your favorites' : 'Check back later for available routes'"
                        size="md">
                    </rx-empty-state>
                }
            </div>
        </section>
    </div>
}
