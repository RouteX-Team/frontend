<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>RouteX - University Bus Tracking</title>
  <base href="/">

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="RouteX - Real-time university bus tracking system. Track campus buses, view routes, and get accurate ETAs.">
  <meta name="keywords" content="university bus, campus transit, bus tracking, RouteX">
  <meta name="author" content="RouteX Team">

  <!-- Viewport & Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RouteX">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="rx-skip-link">Skip to main content</a>

  <app-root></app-root>

  <!-- Theme Detection Script (runs before Angular loads) -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('rx-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</body>

</html>
