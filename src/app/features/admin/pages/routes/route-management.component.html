<div class="admin-page-container">
    <header class="page-header">
        <div class="header-content">
            <h1>Route Management</h1>
            <p class="text-muted">Create and manage university bus routes</p>
        </div>
        <button pButton label="New Route" icon="pi pi-plus" (click)="openNew()"></button>
    </header>

    <div class="card shadow-md">
        <p-table [value]="routes()" [rows]="10" [paginator]="true" [globalFilterFields]="['name','shortCode']"
            responsiveLayout="scroll" [rowHover]="true" dataKey="id" styleClass="p-datatable-sm">

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="shortCode">Code <p-sortIcon field="shortCode"></p-sortIcon></th>
                    <th pSortableColumn="name">Route Name <p-sortIcon field="name"></p-sortIcon></th>
                    <th>Color</th>
                    <th pSortableColumn="isActive" class="text-center">Status <p-sortIcon field="isActive"></p-sortIcon>
                    </th>
                    <th class="text-right">Stops</th>
                    <th class="text-center">Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-route>
                <tr>
                    <td><span class="font-bold text-indigo-600 dark:text-indigo-400">{{ route.shortCode }}</span></td>
                    <td class="font-medium">{{ route.name }}</td>
                    <td>
                        <div class="color-preview" [style.background-color]="route.color" [title]="route.color"></div>
                    </td>
                    <td class="text-center">
                        <span [class]="'status-badge ' + (route.isActive ? 'active' : 'inactive')">
                            @if (route.isActive) {
                            <i class="pi pi-check-circle text-[10px]"></i>
                            } @else {
                            <i class="pi pi-times-circle text-[10px]"></i>
                            }
                            {{ route.isActive ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                    <td class="text-right">
                        <span class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-xs font-semibold">
                            {{ route.stops?.length || 0 }}
                        </span>
                    </td>
                    <td class="text-center">
                        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-info mr-2"
                            (click)="editRoute(route)" title="Edit Route"></button>
                        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger"
                            (click)="deleteRoute(route)" title="Delete Route"></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- Edit/New Dialog -->
    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
    <p-toast></p-toast>
</div>
